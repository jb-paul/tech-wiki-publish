<rect x="350" y="90" width="300" height="175" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="500" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">Semantic Evidence Graph</text><text x="500" y="160" text-anchor="middle" font-size="13" fill="#334155">Infrastructure Ontology</text><text x="500" y="186" text-anchor="middle" font-size="13" fill="#334155">Entity Resolution · Time · Provenance</text><text x="500" y="212" text-anchor="middle" font-size="13" fill="#334155">Dependency · Symptom · Change · Incident</text>
