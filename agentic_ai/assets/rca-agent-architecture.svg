<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Data Center RCA Agent 참조 아키텍처</title><desc id="desc">관측 데이터와 인프라 온톨로지가 증거 그래프로 통합되고 가설 생성, 반증, 사람 승인, 통제된 복구로 이어지는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Data Center Infrastructure RCA Agent</text>
