<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">웹 채팅 UI와 Hermes 및 OpenCode Agent 통합 아키텍처</title>
  <desc id="desc">왼쪽의 브라우저 채팅 UI가 중앙의 Website Backend와 Agent Gateway를 거쳐 오른쪽 위 Hermes API Server 또는 오른쪽 아래 OpenCode Server와 격리된 저장소 작업공간으로 연결된다. Gateway는 인증, 세션 소유권, 라우팅, 승인, 취소, 감사 기능을 담당한다.</desc>
  <defs>
    <style>
      .bg{fill:#0f172a}.panel{fill:#172033;stroke:#94a3b8;stroke-width:2}.gateway{fill:#1e293b;stroke:#38bdf8;stroke-width:3}.hermes{fill:#24213d;stroke:#a78bfa;stroke-width:3}.opencode{fill:#162a27;stroke:#34d399;stroke-width:3}.workspace{fill:#2b2117;stroke:#f59e0b;stroke-width:2}.title{fill:#f8fafc;font:700 25px 'WenQuanYi Zen Hei','Unifont',sans-serif}.label{fill:#e2e8f0;font:600 18px 'WenQuanYi Zen Hei','Unifont',sans-serif}.small{fill:#cbd5e1;font:15px 'WenQuanYi Zen Hei','Unifont',sans-serif}.arrow{stroke:#cbd5e1;stroke-width:3;fill:none;marker-end:url(#arrow)}.boundary{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;fill:none}.num{fill:#0f172a;stroke:#f8fafc;stroke-width:2}.numtext{fill:#f8fafc;font:700 15px sans-serif;text-anchor:middle;dominant-baseline:middle}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="52">Web Chat Agent Integration</text>
  <text class="small" x="48" y="80">공통 사용자 표면과 제품별 Agent runtime 사이의 보안·세션 경계</text>

  <rect class="panel" x="50" y="220" rx="18" width="245" height="210"/>
  <text class="label" x="172" y="265" text-anchor="middle">Browser Chat UI</text>
  <text class="small" x="78" y="310">- 사용자 메시지</text>
  <text class="small" x="78" y="340">- Agent 선택</text>
  <text class="small" x="78" y="370">- 진행·승인·Diff 표시</text>
  <text class="small" x="78" y="400">- API secret 없음</text>

  <rect class="gateway" x="385" y="145" rx="20" width="360" height="370"/>
  <text class="label" x="565" y="190" text-anchor="middle">Website Backend / Agent Gateway</text>
  <line x1="420" y1="212" x2="710" y2="212" stroke="#38bdf8" opacity="0.6"/>
  <text class="small" x="425" y="250">- 사용자·Tenant 인증</text>
  <text class="small" x="425" y="285">- Conversation 소유권과 세션 매핑</text>
  <text class="small" x="425" y="320">- Agent 라우팅과 Capability 정규화</text>
  <text class="small" x="425" y="355">- SSE 중계와 재연결</text>
  <text class="small" x="425" y="390">- 승인·중단·Rate limit·Budget</text>
  <text class="small" x="425" y="425">- Tool·Side effect·Diff 감사</text>
  <text class="small" x="425" y="470">Hermes Adapter  |  OpenCode Adapter</text>

  <rect class="hermes" x="840" y="120" rx="18" width="305" height="205"/>
  <text class="label" x="992" y="165" text-anchor="middle">Hermes API Server</text>
  <text class="small" x="875" y="205">- Responses / Conversations</text>
  <text class="small" x="875" y="237">- Runs / Sessions / SSE</text>
  <text class="small" x="875" y="269">- Research·Wiki·Automation</text>
  <text class="small" x="875" y="301">- Tools·Skills·Memory</text>

  <rect class="opencode" x="840" y="385" rx="18" width="305" height="185"/>
  <text class="label" x="992" y="430" text-anchor="middle">OpenCode Server</text>
  <text class="small" x="875" y="470">- OpenAPI / SDK / Sessions</text>
  <text class="small" x="875" y="502">- Events / Abort / Permission</text>
  <text class="small" x="875" y="534">- Diff·Revert·Coding Loop</text>

  <rect class="workspace" x="840" y="605" rx="15" width="305" height="62"/>
  <text class="label" x="992" y="643" text-anchor="middle">Isolated Worktree / Container</text>

  <path class="arrow" d="M295 325 H385"/>
  <path class="arrow" d="M745 260 C790 260 795 220 840 220"/>
  <path class="arrow" d="M745 395 C790 395 795 475 840 475"/>
  <path class="arrow" d="M992 570 V605"/>

  <rect class="boundary" x="365" y="100" rx="25" width="800" height="495"/>
  <text class="small" x="380" y="125">Server-side trust boundary</text>

  <circle class="num" cx="320" cy="305" r="16"/><text class="numtext" x="320" y="305">1</text>
  <circle class="num" cx="790" cy="235" r="16"/><text class="numtext" x="790" y="235">2</text>
  <circle class="num" cx="790" cy="448" r="16"/><text class="numtext" x="790" y="448">3</text>
  <text class="small" x="50" y="650">읽는 순서: 1 사용자 요청 → 2 Hermes 범용 작업 / 3 OpenCode 저장소 작업</text>
</svg>
