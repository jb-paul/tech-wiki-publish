<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Agentic AI Ontology 계층</title><desc id="desc">원시 데이터에서 엔터티 정렬, 도메인 온톨로지, 작업과 도구 역량, 에이전트 계획으로 이어지는 의미 계층</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1120" height="660" rx="24" fill="#f8fafc"/><text x="560" y="44" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Ontology는 Agent의 의미·제약 계층이다</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="100" y="530" width="920" height="82" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="560" y="562" font-size="18" font-weight="700" fill="#1e293b">원시 관찰과 시스템 데이터</text><text x="560" y="588" font-size="13" fill="#475569">문서 · 로그 · 메트릭 · 코드 · CMDB · API 응답</text>
<rect x="150" y="420" width="820" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="560" y="451" font-size="18" font-weight="700" fill="#1e3a8a">정규화·Entity Resolution·Provenance</text><text x="560" y="477" font-size="13" fill="#334155">서로 다른 이름을 동일 엔터티에 연결하고 출처·시간을 보존</text>
<rect x="200" y="310" width="720" height="80" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="560" y="341" font-size="18" font-weight="700" fill="#4c1d95">Domain / World Ontology</text><text x="560" y="367" font-size="13" fill="#334155">Class · Relation · Constraint · Rule · Temporal Semantics</text>
<rect x="250" y="200" width="620" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560" y="231" font-size="18" font-weight="700" fill="#14532d">Task · Tool · Capability Ontology</text><text x="560" y="257" font-size="13" fill="#334155">어떤 목표에 어떤 도구를 어떤 조건에서 사용할 수 있는가</text>
<rect x="300" y="90" width="520" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="560" y="121" font-size="18" font-weight="700" fill="#78350f">Agent Planning · Retrieval · Validation</text><text x="560" y="147" font-size="13" fill="#334155">의미와 제약에 근거한 후보 축소·계획·결과 검사</text></g>
<g stroke="#475569" stroke-width="3" marker-end="url(#a)"><path d="M560 530V500"/><path d="M560 420V390"/><path d="M560 310V280"/><path d="M560 200V170"/></g>
<g font-family="sans-serif" font-size="13" fill="#334155"><text x="24" y="460">데이터 층</text><text x="24" y="350">의미 층</text><text x="24" y="240">행동 층</text><text x="24" y="130">의사결정 층</text></g>
<path d="M920 350 C1040 350 1040 130 820 130" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="950" y="250" font-family="sans-serif" font-size="13" fill="#9f1239">제약 검증</text>
</svg>