<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Agentic AI 안전 게이트</title><desc id="desc">읽기, 저위험 변경, 고위험 변경으로 갈수록 권한과 승인 및 롤백 통제가 강화되는 단계</desc><rect width="1120" height="600" rx="24" fill="#f8fafc"/><text x="560" y="46" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">자율성은 능력이 아니라 권한과 검증의 단계다</text>
<g font-family="sans-serif"><path d="M100 500 L300 390 L500 280 L700 170 L900 60 L1010 60 L1010 500 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<rect x="80" y="420" width="200" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="455" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">1. Shadow</text><text x="180" y="483" text-anchor="middle" font-size="13" fill="#334155">제안만 생성</text><text x="180" y="506" text-anchor="middle" font-size="13" fill="#334155">실행 없음</text>
<rect x="310" y="340" width="200" height="110" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="410" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#0c4a6e">2. Read-only</text><text x="410" y="403" text-anchor="middle" font-size="13" fill="#334155">조회·진단</text><text x="410" y="426" text-anchor="middle" font-size="13" fill="#334155">증거 보존</text>
<rect x="540" y="260" width="200" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="640" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">3. Guarded</text><text x="640" y="323" text-anchor="middle" font-size="13" fill="#334155">사람 승인 후 실행</text><text x="640" y="346" text-anchor="middle" font-size="13" fill="#334155">Canary·Rollback</text>
<rect x="770" y="180" width="200" height="110" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="870" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#881337">4. Limited Autonomy</text><text x="870" y="243" text-anchor="middle" font-size="13" fill="#334155">정해진 범위 내 자동</text><text x="870" y="266" text-anchor="middle" font-size="13" fill="#334155">예외 즉시 중단</text>
<text x="535" y="565" text-anchor="middle" font-size="14" fill="#334155">권한 · Blast Radius · 검증 · 감사 · 복구 요구 수준 증가 →</text><text x="1000" y="125" text-anchor="middle" font-size="13" fill="#9f1239" transform="rotate(-90 1000 125)">위험 증가</text></g>
</svg>